<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Run the browser tests with fonts like GitHub's Ubuntu runners on a Linux machine that has Inter
  installed (Claude's cloud sessions do): Chromium then falls back to DejaVu Sans, which is wider,
  as on the runners. Layout bugs at 320 px with large text show up only with the wider fonts.

    FONTCONFIG_FILE=$PWD/tests/e2e/fonts-like-ci.conf npm run test:e2e
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>*/Inter*</glob>
      <glob>*/inter*</glob>
      <pattern><patelt name="family"><string>Inter</string></patelt></pattern>
      <pattern><patelt name="family"><string>Inter Display</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
